      {

        "options": [

          "B) provocar ionização da matéria ao interagir com ela.",

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const progressBar = document.getElementById("progress-bar");

    const quizBox = document.getElementById("quiz-box");
    const resultBox = document.getElementById("result-box");

    const scoreEl = document.getElementById("score");
    const totalEl = document.getElementById("total");

    const restartBtn = document.getElementById("restart-btn");
    const questionCounterEl =
      document.getElementById("question-counter");

    let currentQuestion = 0;
    let score = 0;


    totalEl.textContent = questions.length;


    function loadQuestion() {

      const q = questions[currentQuestion];

      questionEl.innerHTML = q.question;

      optionsEl.innerHTML = "";


      q.options.forEach((opt, i) => {

        const li = document.createElement("li");

        li.textContent = opt;

        li.classList.add("option");

        li.addEventListener("click", () => {
          selectOption(i);
        });

        optionsEl.appendChild(li);

      });


      nextBtn.style.display = "none";

      updateProgress();


      questionCounterEl.textContent =
        `Questão ${currentQuestion + 1} de ${questions.length}`;

    }


    function selectOption(index) {

      const q = questions[currentQuestion];

      const allOptions =
        document.querySelectorAll(".option");


      allOptions.forEach((opt, i) => {

        if (i === q.answer) {
          opt.classList.add("correct");
        }

        if (i === index && i !== q.answer) {
          opt.classList.add("wrong");
        }

        opt.style.pointerEvents = "none";

      });


      if (index === q.answer) {
        score++;
      }


      nextBtn.style.display = "block";

    }


    nextBtn.addEventListener("click", () => {

      currentQuestion++;


      if (currentQuestion < questions.length) {

        loadQuestion();

      } else {

        showResult();

      }

    });


    function updateProgress() {

      const pct =
        ((currentQuestion) / questions.length) * 100;

      progressBar.style.width = pct + "%";

    }


    function showResult() {

      quizBox.classList.add("hidden");

      resultBox.classList.remove("hidden");


      scoreEl.textContent = score;


      const percent =
        Math.round((score / questions.length) * 100);


      const resultBar =
        document.getElementById("result-bar");

      const resultPercent =
        document.getElementById("result-percent");

      const resultMessage =
        document.getElementById("result-message");


      resultBar.style.width = percent + "%";

      resultPercent.textContent =
        percent + "% de aproveitamento";


      let msg =
        percent >= 70
          ? "👏 Muito bom!"
          : "📚 Revise o conteúdo.";


      resultMessage.textContent = msg;

    }


    restartBtn.addEventListener("click", () => {

      score = 0;

      currentQuestion = 0;

      resultBox.classList.add("hidden");

      quizBox.classList.remove("hidden");

      loadQuestion();

    });


    loadQuestion();

  </script>
